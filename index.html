<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype CMU Maintenance</title>
    <link rel="stylesheet" href="prototype.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="prototype.js" defer></script>
</head>
<body>


<div class="device">
    <div class="notch"></div>
    
    <div class="header-minimal z-10 relative flex justify-between items-center">
        <span id="app-title-text" class="text-[11px] font-black tracking-widest uppercase text-black truncate max-w-[140px]">PROTOTYPE CMU MAINTENANCE</span>
        <div class="flex items-center space-x-1.5 flex-shrink-0">
            <span id="user-profile" class="text-[10px] text-gray-400 normal-case tracking-normal font-bold"></span>
            <div class="flex items-center space-x-1 border-2 border-gray-300 rounded px-1.5 py-0.5 bg-white text-gray-600 hover:border-black transition-all">
                <i class="fas fa-search-plus text-[9px] text-gray-400"></i>
                <select id="zoom-select" onchange="setZoom(parseFloat(this.value))" class="text-[10px] font-extrabold bg-transparent text-gray-700 hover:text-black outline-none cursor-pointer">
                    <option value="1" selected>100%</option>
                    <option value="0.9">90%</option>
                    <option value="0.8">80%</option>
                    <option value="0.75">75%</option>
                    <option value="0.5">50%</option>
                </select>
            </div>
            <button id="lang-toggle" onclick="toggleLang()" class="text-[10px] border-2 border-gray-300 rounded px-2 py-0.5 text-gray-600 hover:text-black hover:border-black font-extrabold transition-all">TH</button>
        </div>
    </div>

    <div id="app-content" class="content relative">
        <!-- Content gets injected here by JS -->
    </div>

    <div id="bottom-nav" class="bottom-nav">
        <!-- Navigation gets injected dynamically based on Role -->
    </div>
</div>

</body>
</html>
